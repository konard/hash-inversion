[package]
name = "hash-inversion"
version = "0.1.0"
edition = "2021"
description = "Hash inversion prototype exploring invertible hash functions and lookup table approaches"
readme = "README.md"
license = "Unlicense"
keywords = ["hash", "inversion", "cryptography", "preimage"]
categories = ["cryptography", "algorithms"]
repository = "https://github.com/konard/hash-inversion"
documentation = "https://github.com/konard/hash-inversion"
rust-version = "1.70"

[lib]
name = "hash_inversion"
path = "src/lib.rs"

[[bin]]
name = "hash-inversion"
path = "src/main.rs"

[dependencies]
md-5 = "0.10"
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
